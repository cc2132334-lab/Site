<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta 5M Live Tracker (0.5s WebSocket)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-2xl">
        <!-- Header -->
        <div class="text-center my-6">
            <h1 class="text-2xl font-bold text-yellow-400">⚡ Delta Live Tracker</h1>
            <p class="text-gray-400 text-sm mt-1">Real-time Live WebSocket (Sub-second)</p>
            <div id="connection-status" class="text-xs text-yellow-500 mt-2">Connecting to Live Feed...</div>
        </div>

        <!-- Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- BTC Card -->
            <div id="btc-card" class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold">BTCUSD</h2>
                    <span id="btc-badge" class="px-2.5 py-1 text-xs font-semibold rounded bg-gray-800 text-gray-400">Connecting...</span>
                </div>
                <div class="text-3xl font-extrabold mb-3 text-green-400" id="btc-price">$0.00</div>
                
                <div class="space-y-2 text-sm border-t border-gray-800 pt-3">
                    <div class="flex justify-between text-gray-400">
                        <span>Latest 5m Volume:</span>
                        <span id="btc-vol" class="text-white font-medium">-</span>
                    </div>
                    <div class="flex justify-between text-gray-400">
                        <span>20 SMA Volume:</span>
                        <span id="btc-sma" class="text-white font-medium">-</span>
                    </div>
                    <div class="flex justify-between font-bold">
                        <span>Volume Ratio:</span>
                        <span id="btc-ratio" class="text-yellow-400">-</span>
                    </div>
                </div>
            </div>

            <!-- ETH Card -->
            <div id="eth-card" class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold">ETHUSD</h2>
                    <span id="eth-badge" class="px-2.5 py-1 text-xs font-semibold rounded bg-gray-800 text-gray-400">Connecting...</span>
                </div>
                <div class="text-3xl font-extrabold mb-3 text-green-400" id="eth-price">$0.00</div>
                
                <div class="space-y-2 text-sm border-t border-gray-800 pt-3">
                    <div class="flex justify-between text-gray-400">
                        <span>Latest 5m Volume:</span>
                        <span id="eth-vol" class="text-white font-medium">-</span>
                    </div>
                    <div class="flex justify-between text-gray-400">
                        <span>20 SMA Volume:</span>
                        <span id="eth-sma" class="text-white font-medium">-</span>
                    </div>
                    <div class="flex justify-between font-bold">
                        <span>Volume Ratio:</span>
                        <span id="eth-ratio" class="text-yellow-400">-</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const symbols = ["BTCUSD", "ETHUSD"];
        const prefixMap = { "BTCUSD": "btc", "ETHUSD": "eth" };

        // 1. Live WebSocket for Sub-second (0.5s) Price Ticks
        function startWebSocket() {
            const socket = new WebSocket("wss://socket.delta.exchange");

            socket.onopen = () => {
                document.getElementById("connection-status").innerText = "● Live Connected (Real-time 0.5s feed)";
                document.getElementById("connection-status").className = "text-xs text-green-400 mt-2";

                // Delta Exchange v2 Ticker subscription
                const subMsg = {
                    type: "subscribe",
                    payload: {
                        channels: [
                            {
                                name: "v2/ticker",
                                symbols: symbols
                            }
                        ]
                    }
                };
                socket.send(JSON.stringify(subMsg));
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.symbol && (data.close || data.mark_price)) {
                    const prefix = prefixMap[data.symbol];
                    if (prefix) {
                        const price = parseFloat(data.close || data.mark_price);
                        const priceElem = document.getElementById(`${prefix}-price`);
                        priceElem.innerText = `$${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                    }
                }
            };

            socket.onerror = (err) => {
                console.error("WS Error:", err);
            };

            socket.onclose = () => {
                document.getElementById("connection-status").innerText = "Disconnected. Reconnecting...";
                document.getElementById("connection-status").className = "text-xs text-red-400 mt-2";
                setTimeout(startWebSocket, 2000); // Auto reconnect
            };
        }

        // 2. Fetch Candlesticks for 20 SMA Calculation
        async function fetchCandles(symbol) {
            try {
                const url = `https://api.delta.exchange/v2/history/candles?resolution=5m&symbol=${symbol}`;
                const res = await fetch(url);
                const json = await res.json();
                return json.result ? json.result.reverse() : [];
            } catch (e) {
                return [];
            }
        }

        function calculateSMA(candles, period = 20) {
            const closedCandles = candles.slice(0, -1);
            const slice = closedCandles.slice(-period);
            const sum = slice.reduce((acc, c) => acc + parseFloat(c.volume || 0), 0);
            return sum / (slice.length || 1);
        }

        async function updateVolumeMetrics(symbol, prefix) {
            const candles = await fetchCandles(symbol);
            if (!candles || candles.length < 5) return;

            const lastClosed = candles[candles.length - 2] || candles[candles.length - 1];
            const latestVol = parseFloat(lastClosed.volume);
            const closePrice = parseFloat(lastClosed.close);
            const isBullish = closePrice >= parseFloat(lastClosed.open);
            const sma20 = calculateSMA(candles, 20);
            const ratio = sma20 > 0 ? (latestVol / sma20) : 0;

            document.getElementById(`${prefix}-vol`).innerText = latestVol.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById(`${prefix}-sma`).innerText = sma20.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById(`${prefix}-ratio`).innerText = `${ratio.toFixed(2)}x`;

            const badge = document.getElementById(`${prefix}-badge`);
            const card = document.getElementById(`${prefix}-card`);

            if (ratio >= 2.0) {
                badge.innerText = isBullish ? "🔥 2x SPIKE (LONG)" : "🔥 2x SPIKE (SHORT)";
                badge.className = isBullish 
                    ? "px-2.5 py-1 text-xs font-bold rounded bg-green-500/20 text-green-400 border border-green-500" 
                    : "px-2.5 py-1 text-xs font-bold rounded bg-red-500/20 text-red-400 border border-red-500";
                card.classList.add("border-yellow-500");
            } else {
                badge.innerText = isBullish ? "Normal (Bullish)" : "Normal (Bearish)";
                badge.className = "px-2.5 py-1 text-xs font-semibold rounded bg-gray-800 text-gray-400";
                card.classList.remove("border-yellow-500");
            }
        }

        function refreshAllMetrics() {
            updateVolumeMetrics("BTCUSD", "btc");
            updateVolumeMetrics("ETHUSD", "eth");
        }

        // Start WebSocket for continuous live feed
        startWebSocket();

        // 5-minute candles need update every 10 seconds
        refreshAllMetrics();
        setInterval(refreshAllMetrics, 10000);
    </script>
</body>
</html>
